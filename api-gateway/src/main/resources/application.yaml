server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: habit-service
              uri: lb://HABIT-SERVICE
              predicates:
                - Path=/api/habits/**

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auths/**

app:
  cors:
    # Comma-separated list of frontend origins allowed to access the gateway
    # Override with environment variable CORS_ALLOWED_ORIGINS
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://habitosfedeploy.vercel.app}
    # Comma-separated list of wildcard origin patterns (optional)
    # Example: https://*.vercel.app
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}




eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
