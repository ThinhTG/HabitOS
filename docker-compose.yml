services:
  server-registry:
    build:
      context: ./server-registry
    ports:
      - "8761:8761"
    environment:
      EUREKA_URL: http://server-registry:8761/eureka

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    env_file:
      - ./habitos.env
    environment:
      EUREKA_URL: http://server-registry:8761/eureka
    depends_on:
      - server-registry

  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8081:8081"
    env_file:
      - ./habitos.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: disabled
      REDIS_PORT: 0
      EUREKA_URL: http://server-registry:8761/eureka
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      JWT_SECRET: ${JWT_SECRET:-trangiathinhsupersecuritysecretkey170503enjoycodingeveryday}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      - postgres
      - server-registry

  hatbit-service:
    build:
      context: ./hatbit-service
    ports:
      - "8082:8082"
    env_file:
      - ./habitos.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: disabled
      REDIS_PORT: 0
      EUREKA_URL: http://server-registry:8761/eureka
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      JWT_SECRET: ${JWT_SECRET:-trangiathinhsupersecuritysecretkey170503enjoycodingeveryday}
    depends_on:
      - postgres
      - server-registry

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Thinh123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

volumes:
  postgres_data:
